{% extends 'base.html' %}
{% block content %}
<style>
    .auth-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .auth-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 40px rgba(76, 175, 80, 0.1);
        overflow: hidden;
        width: 100%;
        max-width: 450px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.3s ease;
        position: relative;
    }

    .auth-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 25px 70px rgba(0,0,0,0.2), 0 0 50px rgba(76, 175, 80, 0.15);
    }

    .auth-header {
        background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
        padding: 40px;
        text-align: center;
        color: white;
    }

    .auth-header i {
        font-size: 3rem;
        margin-bottom: 15px;
        background: rgba(255,255,255,0.2);
        width: 80px;
        height: 80px;
        line-height: 80px;
        border-radius: 50%;
        display: inline-block;
        animation: hotspotPulse 2.5s ease-in-out infinite;
        box-shadow: 0 0 0 0 rgba(255,255,255,0.4);
    }

    @keyframes hotspotPulse {
        0% {
            transform: scale(1);
            box-shadow: 0 0 0 0 rgba(255,255,255,0.4);
            opacity: 1;
        }
        50% {
            transform: scale(1.08);
            box-shadow: 0 0 0 15px rgba(255,255,255,0);
        }
        100% {
            transform: scale(1);
            box-shadow: 0 0 0 0 rgba(255,255,255,0);
            opacity: 1;
        }
    }

    .auth-body {
        padding: 40px;
    }

    .form-label {
        font-weight: 600;
        color: #555;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px 15px;
        border: 2px solid #f0f0f0;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: var(--accent-green);
        box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
    }

    .btn-auth {
        background: var(--primary-green);
        color: white;
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        width: 100%;
        border: none;
        margin-top: 10px;
        transition: all 0.3s ease;
    }

    .btn-auth:hover {
        background: var(--dark-green);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(46, 125, 50, 0.2);
    }

    .auth-footer {
        text-align: center;
        margin-top: 25px;
        color: #777;
    }

    .auth-footer a {
        color: var(--primary-green);
        text-decoration: none;
        font-weight: 700;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    .input-group-text {
        background: transparent;
        border: 2px solid #f0f0f0;
        border-right: none;
        border-radius: 12px 0 0 12px;
        color: #777;
    }

    .form-control-with-icon {
        border-left: none;
        border-radius: 0 12px 12px 0;
    }

    .password-input-wrapper {
        position: relative;
        width: 100%;
    }

    .password-toggle-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: #6c757d;
        cursor: pointer;
        font-size: 1rem;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .password-toggle-btn:hover {
        color: var(--accent-green);
    }

    /* Form Validation Feedback */
    .invalid-feedback {
        display: block;
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 0.5rem;
        font-weight: 500;
    }

    .form-control.is-invalid {
        border-color: #dc3545;
    }

    .form-control.is-invalid:focus {
        border-color: #dc3545;
        box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.1);
    }

    .alert-validation {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
        border-radius: 12px;
        padding: 12px 15px;
        margin-bottom: 20px;
        font-size: 0.95rem;
        animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Loading Spinner */
    .loading-spinner {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
    }

    .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid var(--primary-green);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .btn-auth:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .btn-auth.loading {
        position: relative;
        color: transparent;
    }

    .btn-auth.loading::after {
        content: '';
        position: absolute;
        width: 16px;
        height: 16px;
        top: 50%;
        left: 50%;
        margin-left: -8px;
        margin-top: -8px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-seedling"></i>
            <h3 class="mb-0">Farmer Login</h3>
            <p class="mb-0 opacity-75">Welcome back to Project NPK</p>
        </div>
        <div class="auth-body">
            {% if error %}
                <div class="alert alert-validation" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                </div>
            {% endif %}
            <form method="POST" id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control form-control-with-icon" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <div class="password-input-wrapper">
                            <input type="password" name="password" id="passwordInput" class="form-control form-control-with-icon" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Show or hide password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-auth" id="submitBtn">Sign In</button>
            </form>

            <div class="auth-footer">
                <p>New here? <a href="/register">Create a Farmer Account</a></p>
                <a href="/" class="text-muted d-block mt-3 small"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
    });

    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('passwordInput');

    togglePasswordBtn.addEventListener('click', function() {
        const icon = this.querySelector('i');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
</script>
{% endblock %}
